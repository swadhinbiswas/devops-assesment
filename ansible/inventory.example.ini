# Copy to inventory.ini and point at your hosts.
# The playbook expects Ubuntu/Debian targets with SSH key access and a user
# that can sudo without a password prompt (or pass --ask-become-pass).

[servers]
# staging ansible_host=203.0.113.10 ansible_user=ubuntu
# production ansible_host=203.0.113.11 ansible_user=ubuntu

[servers:vars]
ansible_python_interpreter=/usr/bin/python3
