name: Release

# GitHub Actions owns releases. This workflow starts when the "PR checks"
# workflow completes on main. Buildkite's GitHub Actions pipeline trigger does
# not support workflow_run, so it cannot import this workflow; Buildkite stays
# a pull-request mirror. A prepare job skips commits that do not touch build
# inputs, so docs-only merges do not run the immutable version-tag check.
on:
  workflow_run:
    workflows:
      - PR checks
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  REGISTRY_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/devops-task
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  prepare:
    name: prepare-release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, Linux, X64]
    outputs:
      needed: ${{ steps.changes.outputs.needed }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Check for build inputs
        id: changes
        run: |
          set -euo pipefail
          if base=$(git rev-parse HEAD^ 2>/dev/null); then
            if git diff --quiet "$base" HEAD -- app Dockerfile .dockerignore pyproject.toml uv.lock VERSION; then
              needed=false
            else
              needed=true
            fi
          else
            needed=true
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "release needed: $needed"

  build-and-deploy:
    name: build-and-deploy
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    runs-on: [self-hosted, Linux, X64, docker]
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Read version
        id: version
        run: |
          version=$(cat VERSION)
          test -n "$version"
          echo "value=${version}" >> "$GITHUB_OUTPUT"
          echo "release tag: v${version}"

      - name: Check the version tag is new
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          tag_url="https://hub.docker.com/v2/repositories/${{ vars.DOCKERHUB_USERNAME }}/devops-task/tags/v${VERSION}"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$tag_url")
          if [ "$code" = "200" ]; then
            echo "v${VERSION} already exists; bump VERSION before releasing" >&2
            exit 1
          fi
          if [ "$code" != "404" ]; then
            echo "could not confirm the version tag is new (HTTP $code)" >&2
            exit 1
          fi
          echo "v${VERSION} is a new tag"

      - name: Set build metadata
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        if: vars.EC2_INSTANCE_ID != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-release-${{ github.run_id }}

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_KEY }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:v${{ steps.version.outputs.value }}
            ${{ env.REGISTRY_IMAGE }}:${{ env.RELEASE_SHA }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ env.RELEASE_SHA }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Keyless signing: cosign uses the workflow's GitHub OIDC identity, so
      # no signing key is stored anywhere. The signature and SBOM attestation
      # are attached to the image digest in the registry.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image (keyless)
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Install syft
        env:
          SYFT_VERSION: 1.54.0
          SYFT_SHA256: 54a87372498168b2d033e876fd41fa4e8035b872699e525a57046e1f2f09c860
        run: |
          mkdir -p .ci-bin
          curl -fsSL -o /tmp/syft.tar.gz "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  /tmp/syft.tar.gz" | sha256sum -c -
          tar -xzf /tmp/syft.tar.gz -C .ci-bin syft
          ./.ci-bin/syft version

      # Artifact storage is unavailable on this account, so the SBOM stays in
      # the workspace for the attest step instead of being uploaded.
      - name: Generate SPDX SBOM
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          ./.ci-bin/syft scan "${IMAGE}@${DIGEST}" -o "spdx-json=sbom.spdx.json" -q
          test -s sbom.spdx.json
          python3 -c "import json; d=json.load(open('sbom.spdx.json')); print('SBOM packages:', len(d.get('packages', [])))"

      - name: Attest the SBOM
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE}@${DIGEST}"

      - name: Sync deploy script
        if: vars.EC2_INSTANCE_ID != ''
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          script_url="https://raw.githubusercontent.com/${{ github.repository }}/${{ env.RELEASE_SHA }}/scripts/deploy.sh"
          expected=$(sha256sum scripts/deploy.sh | awk '{print $1}')
          parameters=$(jq -cn --arg cmd "curl -fsSL -o /opt/devops-task/deploy.sh '$script_url' && echo '$expected  /opt/devops-task/deploy.sh' | sha256sum -c - && chmod +x /opt/devops-task/deploy.sh" '{commands: [$cmd]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "sync deploy script" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)
          status=Pending
          for _ in $(seq 1 30); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done
          if [ "$status" != "Success" ]; then
            echo "deploy script sync failed with status $status" >&2
            exit 1
          fi

      # deploy.sh records the previous tag and rolls back internally if the
      # new container fails its version-aware health check.
      - name: Deploy to EC2
        id: deploy
        if: vars.EC2_INSTANCE_ID != ''
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_URI: ${{ env.REGISTRY_IMAGE }}:${{ env.RELEASE_SHA }}
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          parameters=$(jq -cn --arg cmd "/opt/devops-task/deploy.sh $IMAGE_URI $APP_VERSION" '{commands: [$cmd]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy v$APP_VERSION ($RELEASE_SHA)" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)
          echo "SSM command: $command_id"
          status=Pending
          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text >&2
          if [ "$status" != "Success" ]; then
            echo "deploy failed with status $status" >&2
            exit 1
          fi

      - name: Smoke test
        id: smoke
        if: vars.EC2_INSTANCE_ID != ''
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          parameters=$(jq -cn --arg cmd "curl -fsS --max-time 5 http://127.0.0.1:8080/health | grep -q '\"version\":\"$APP_VERSION\"'" '{commands: [$cmd]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "smoke test" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)
          status=Pending
          for _ in $(seq 1 30); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          if [ "$status" != "Success" ]; then
            echo "smoke test failed with status $status" >&2
            exit 1
          fi
