name: Release

# GitHub Actions owns releases. Buildkite's GitHub app imports this workflow
# too, so every step is guarded with BUILDKITE. Under Buildkite the job is
# skipped and never builds, signs, or pushes a second image. GitHub Actions
# reads VERSION and tags the image with v<VERSION> and the full commit SHA.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  REGISTRY_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/devops-task

jobs:
  build-and-deploy:
    name: build-and-deploy
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, docker]
    timeout-minutes: 30
    steps:
      - name: Check out
        if: ${{ env.BUILDKITE != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version
        id: version
        if: ${{ env.BUILDKITE != 'true' }}
        run: |
          version=$(cat VERSION)
          test -n "$version"
          echo "value=${version}" >> "$GITHUB_OUTPUT"
          echo "release tag: v${version}"

      - name: Check the version tag is new
        if: ${{ env.BUILDKITE != 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          tag_url="https://hub.docker.com/v2/repositories/${{ vars.DOCKERHUB_USERNAME }}/devops-task/tags/v${VERSION}"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$tag_url")
          if [ "$code" = "200" ]; then
            echo "v${VERSION} already exists; bump VERSION before releasing" >&2
            exit 1
          fi
          if [ "$code" != "404" ]; then
            echo "could not confirm the version tag is new (HTTP $code)" >&2
            exit 1
          fi
          echo "v${VERSION} is a new tag"

      - name: Set build metadata
        if: ${{ env.BUILDKITE != 'true' }}
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        if: ${{ env.BUILDKITE != 'true' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-release-${{ github.run_id }}

      - name: Log in to Docker Hub
        if: ${{ env.BUILDKITE != 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_KEY }}

      - name: Set up QEMU
        if: ${{ env.BUILDKITE != 'true' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        if: ${{ env.BUILDKITE != 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        id: build
        if: ${{ env.BUILDKITE != 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:v${{ steps.version.outputs.value }}
            ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Keyless signing: cosign uses the workflow's GitHub OIDC identity, so
      # no signing key is stored anywhere. The signature and SBOM attestation
      # are attached to the image digest in the registry.
      - name: Install cosign
        if: ${{ env.BUILDKITE != 'true' }}
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image (keyless)
        if: ${{ env.BUILDKITE != 'true' }}
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Install syft
        if: ${{ env.BUILDKITE != 'true' }}
        env:
          SYFT_VERSION: 1.54.0
        run: |
          mkdir -p .ci-bin
          curl -fsSL "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C .ci-bin syft
          ./.ci-bin/syft version

      # Artifact storage is unavailable on this account, so the SBOM stays in
      # the workspace for the attest step instead of being uploaded.
      - name: Generate SPDX SBOM
        if: ${{ env.BUILDKITE != 'true' }}
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          ./.ci-bin/syft scan "${IMAGE}@${DIGEST}" -o "spdx-json=sbom.spdx.json" -q
          test -s sbom.spdx.json
          python3 -c "import json; d=json.load(open('sbom.spdx.json')); print('SBOM packages:', len(d.get('packages', [])))"

      - name: Attest the SBOM
        if: ${{ env.BUILDKITE != 'true' }}
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE}@${DIGEST}"

      - name: Sync deploy script
        if: ${{ env.BUILDKITE != 'true' && vars.EC2_INSTANCE_ID != '' }}
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          script_url="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/deploy.sh"
          parameters=$(jq -cn --arg cmd "curl -fsSL -o /opt/devops-task/deploy.sh '$script_url' && chmod +x /opt/devops-task/deploy.sh" '{commands: [$cmd]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "sync deploy script" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)
          status=Pending
          for _ in $(seq 1 30); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done
          if [ "$status" != "Success" ]; then
            echo "deploy script sync failed with status $status" >&2
            exit 1
          fi

      - name: Deploy to EC2
        id: deploy
        if: ${{ env.BUILDKITE != 'true' && vars.EC2_INSTANCE_ID != '' }}
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_URI: ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          parameters=$(jq -cn --arg cmd "/opt/devops-task/deploy.sh $IMAGE_URI $APP_VERSION" '{commands: [$cmd]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy v$APP_VERSION (${{ github.sha }})" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)
          echo "SSM command: $command_id"
          status=Pending
          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text >&2
          if [ "$status" != "Success" ]; then
            echo "deploy failed with status $status" >&2
            exit 1
          fi

      - name: Smoke test
        id: smoke
        if: ${{ env.BUILDKITE != 'true' && vars.EC2_INSTANCE_ID != '' }}
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          parameters=$(jq -cn --arg cmd "curl -fsS --max-time 5 http://127.0.0.1:8080/health" '{commands: [$cmd]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "smoke test" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)
          status=Pending
          for _ in $(seq 1 30); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          if [ "$status" != "Success" ]; then
            echo "smoke test failed with status $status" >&2
            exit 1
          fi

      - name: Roll back
        if: ${{ env.BUILDKITE != 'true' && vars.EC2_INSTANCE_ID != '' && failure() && (steps.deploy.outcome == 'failure' || steps.smoke.outcome == 'failure') }}
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          parameters=$(jq -cn --arg cmd 'if [ -f /opt/devops-task/previous_image ]; then /opt/devops-task/deploy.sh --rollback; else echo "no previous image"; fi' '{commands: [$cmd]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "rollback" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)
          echo "rollback SSM command: $command_id"
          status=Pending
          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text >&2
          if [ "$status" != "Success" ]; then
            echo "rollback failed with status $status" >&2
            exit 1
          fi
