name: PR checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint-and-test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, docker]
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check version consistency
        run: ./scripts/check_versions.sh

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test with coverage
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=90

      # The job summary is the coverage report; no artifact store is required.
      - name: Coverage summary
        run: |
          {
            echo "### Test coverage"
            echo '```'
            uv run coverage report --show-missing
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy rollback test
        run: ./scripts/test_deploy_rollback.sh

  lint-containers:
    name: lint-containers
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, docker]
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: .
          severity: warning

  config-lint:
    name: config-lint
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, docker]
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Prometheus rules
        run: docker run --rm -v "$PWD/monitoring/prometheus:/rules" --entrypoint /bin/promtool prom/prometheus:v3.0.0 check rules /rules/alerts.yml

      - name: Validate Alertmanager config
        run: docker run --rm -v "$PWD/monitoring/alertmanager:/cfg" --entrypoint /bin/amtool prom/alertmanager:v0.28.1 check-config /cfg/alertmanager.tmpl.yml

      - name: Lint Helm chart
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo alpine/helm:3.16.4 lint charts/devops-task -f charts/devops-task/values-staging.yaml
          docker run --rm -v "$PWD:/repo" -w /repo alpine/helm:3.16.4 lint charts/devops-task -f charts/devops-task/values-production.yaml

      - name: Validate Kubernetes manifests
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/yannh/kubeconform:v0.8.0
          -strict -summary
          k8s/deployment.yaml k8s/service.yaml k8s/ingress.yaml k8s/configmap.yaml k8s/hpa.yaml k8s/secret.example.yaml

      - name: Lint workflows
        if: ${{ hashFiles('.github/workflows/pr.yml') != '' }}
        continue-on-error: true
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7

  image-scan:
    name: image-scan
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, docker]
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag "app:pr-${GITHUB_SHA}" .

      - name: Report image size
        run: docker image inspect --format 'image-size-bytes={{.Size}}' "app:pr-${GITHUB_SHA}"

      - name: Smoke test the built image
        run: |
          set -euo pipefail
          docker rm -f app-smoke >/dev/null 2>&1 || true
          docker run -d --name app-smoke -p 127.0.0.1::8080 "app:pr-${GITHUB_SHA}"
          trap 'docker rm -f app-smoke >/dev/null 2>&1 || true' EXIT
          port=$(docker port app-smoke 8080/tcp | awk -F: '{print $NF}')
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${port}/health" | grep -q '"version":"2.0.1"'; then
              exit 0
            fi
            sleep 1
          done
          echo "image smoke test failed" >&2
          docker logs app-smoke >&2 || true
          exit 1

      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.70.0
          TRIVY_SHA256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
        run: |
          mkdir -p .ci-bin
          curl -fsSL -o /tmp/trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C .ci-bin trivy
          ./.ci-bin/trivy --version

      - name: Scan image
        run: |
          ./.ci-bin/trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed=false "app:pr-${GITHUB_SHA}"
