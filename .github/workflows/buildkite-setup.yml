name: Buildkite setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    name: Create/update the Buildkite pipeline
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Buildkite
        env:
          BUILDKITE_API_KEY: ${{ secrets.BUILDKITE_API_KEY }}
          BUILDKITE_ORG: ${{ vars.BUILDKITE_ORG }}
          BUILDKITE_PIPELINE: ${{ vars.BUILDKITE_PIPELINE }}
        run: |
          chmod +x scripts/buildkite-setup.sh
          ./scripts/buildkite-setup.sh
