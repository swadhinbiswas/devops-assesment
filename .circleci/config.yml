version: 2.1

commands:
  install-lint-tools:
    steps:
      - run:
          name: Install lint and test tools
          command: |
            sudo apt-get update
            sudo apt-get install -y shellcheck
            sudo pip install uv==0.13.7
            curl -fsSL -o /tmp/hadolint \
              https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
            sudo install -m 0755 /tmp/hadolint /usr/local/bin/hadolint

  install-trivy:
    steps:
      - run:
          name: Install Trivy
          command: |
            curl -fsSL -o /tmp/trivy.tar.gz \
              https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
            sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy

jobs:
  pr-checks:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    steps:
      - checkout
      - setup_remote_docker
      - install-lint-tools
      - install-trivy
      - run:
          name: Run PR checks
          command: ./scripts/ci-check.sh
      - store_artifacts:
          path: coverage.xml

  local-checks:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    steps:
      - checkout
      - install-lint-tools
      - run:
          name: Run checks without Docker
          command: ./scripts/ci-check.sh --no-docker

workflows:
  pr:
    jobs:
      - pr-checks:
          filters:
            branches:
              ignore: main
  main:
    jobs:
      - pr-checks:
          filters:
            branches:
              only: main
