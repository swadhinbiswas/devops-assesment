global:
  resolve_timeout: 5m

route:
  receiver: alerts
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: alerts
      repeat_interval: 1h

receivers:
  - name: alerts
    slack_configs:
      - api_url: https://example.invalid/hook
        send_resolved: true
        title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}: {{ .Annotations.description }}{{ "\n" }}{{ end }}'
