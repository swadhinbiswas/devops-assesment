# The application has no built-in secrets; this is the deployment-specific
# placeholder for a future API token or password. The real sensitive value in
# this submission is the Grafana admin password, stored in the `grafana-admin`
# Secret used by the Kubernetes monitoring bonus.
#
# Real secrets are never committed. Create the Secret in the cluster from
# environment variables before applying:
#
#   kubectl create secret generic devops-task-secret \
#     --from-literal=APP_ENV=staging \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# For local kind use any non-empty placeholder values. In production this
# Secret comes from an external secrets manager (see README).
apiVersion: v1
kind: Secret
metadata:
  name: devops-task-secret
  labels:
    app: devops-task
type: Opaque
stringData:
  APP_ENV: CHANGEME
  LOG_LEVEL: CHANGEME
