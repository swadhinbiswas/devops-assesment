apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-task
  labels:
    app: devops-task
spec:
  ingressClassName: nginx
  rules:
    - host: devops-task.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-task
                port:
                  number: 80
